<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tracking preference</title>
<style>
  body{margin:0; min-height:100vh; display:grid; place-items:center; background:#fcfbf9; color:#0f1b2d; font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:420px; padding:32px; text-align:center}
  h1{font-size:1.3rem; margin:0 0 8px}
  p{margin:0 0 20px; color:#4a5568}
  button{font:inherit; font-weight:600; padding:10px 20px; border-radius:999px; border:1px solid #14503c; background:#14503c; color:#fff; cursor:pointer}
  button.alt{background:#fff; color:#14503c}
  a{color:#14503c}
</style>
</head>
<body>
<main>
  <h1 id="state">Checking...</h1>
  <p id="note"></p>
  <button id="toggle" type="button" hidden></button>
  <p style="margin-top:24px"><a href="/">Back to portfolio</a></p>
</main>
<script>
(function () {
  var state = document.getElementById('state'), note = document.getElementById('note'), btn = document.getElementById('toggle');
  function off() { try { return !!localStorage.getItem('gi-notrack'); } catch (e) { return false; } }
  function render() {
    var isOff = off();
    state.textContent = isOff ? 'Tracking is off on this device' : 'Tracking is on on this device';
    note.textContent = isOff ? 'Your visits are not counted in Google Analytics or Vercel Analytics.' : 'Your visits are counted like any other visitor.';
    btn.textContent = isOff ? 'Turn tracking back on' : 'Turn tracking off';
    btn.className = isOff ? 'alt' : '';
    btn.hidden = false;
  }
  btn.addEventListener('click', function () {
    try {
      if (off()) { localStorage.removeItem('gi-notrack'); localStorage.removeItem('va-disable'); }
      else { localStorage.setItem('gi-notrack', '1'); localStorage.setItem('va-disable', '1'); }
    } catch (e) { note.textContent = 'This browser blocks storage, so the setting cannot be saved.'; return; }
    render();
  });
  render();
})();
</script>
</body>
</html>
